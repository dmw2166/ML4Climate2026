# STRUCTURE
# ---------------------------------------------------------------------------
# Parts mirror the course schedule in the syllabus (CLMT5120, Fall 2026), one
# part per teaching week. Week 8 is fall break and Week 14 is the last class
# with no new material, so neither has a part here.
#
# Assignments follow the syllabus convention: the assignment listed under a
# week is DUE the Monday of the following week and covers that week's material.
# Weeks 12-14 carry no assignment.
#
# Three units are not on the syllabus as separate weeks and have been folded
# into the closest one:
#   - uncertainty            -> Week 5 (model evaluation)
#   - remote sensing (x3)    -> Week 10 (CNNs; its natural application)
#   - physicsai              -> Week 12 (advanced topics)
#
# Pages marked below as stubs are placeholders awaiting real content.
# ---------------------------------------------------------------------------

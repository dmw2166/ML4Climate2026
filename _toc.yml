# Table of contents
# Learn more at https://jupyterbook.org/customize/toc.html

format: jb-book
root: intro
# Uncomment a part once at least one of its files exists (a part with no
# chapters won't build). Assignment files are added back once ported into
# 2026 assignments/.
#
# ---------------------------------------------------------------------------
# 3-CREDIT EXPANSION
# ---------------------------------------------------------------------------
# The parts below marked "PLANNED" are the proposed expansion from 1.5 to 3
# credits. They are commented out because their files do not exist yet --
# uncomment each part as its pages are written.
#
# Rationale for the ordering:
#   - Model Evaluation lands right after Supervised ML, so students meet
#     validation immediately after building their first predictive models
#     and before those habits set.
#   - Emulation and Remote Sensing follow Deep Learning, since both lean on
#     the CNN material.
#   - Uncertainty and Interpretability are grouped as the "can I trust this?"
#     block, after students have models worth interrogating.
#   - Foundation Models and Ethics close the course, where they double as
#     context for the final project.
# ---------------------------------------------------------------------------

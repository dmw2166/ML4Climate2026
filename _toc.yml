#
# ---------------------------------------------------------------------------
# STRUCTURE
# ---------------------------------------------------------------------------
# Parts mirror the course schedule in the syllabus (CLMT5120, Fall 2026), one
# part per teaching week. Data preprocessing spans Weeks 2 and 3 and is one
# part. Week 8 is fall break and has no part. Week 14 is the last class. The
# schedule was pushed back one week in late September 2026 and the ethics and
# policy week was dropped to make room.
#
# In November 2026 the last three weeks were rearranged. The CNN lecture filled
# Week 11, so recurrent networks moved to Week 12, generative models to Week 13,
# and Week 14 is foundation models with the carbon-cost notebook. Emulation,
# forecasting, and physics-informed ML stay listed in Week 14 as reading.
#
# Assignments follow the syllabus convention: the assignment listed under a
# week is DUE the Monday of the following week and covers that week's material.
# Assignment 11 (autoencoder anomaly detection) was dropped in November 2026,
# so Weeks 12 to 14 carry no assignment.
#
# Three units are not on the syllabus as separate weeks and have been folded
# into the closest one:
#   - uncertainty            -> Week 6 (model evaluation)
#   - remote sensing (x3)    -> Week 11 (CNNs; its natural application)
#   - physicsai              -> Week 14 (reading)
#
# Pages marked below as stubs are placeholders awaiting real content.
# ---------------------------------------------------------------------------

format: jb-book
root: intro
#
# ---------------------------------------------------------------------------
# 3-CREDIT EXPANSION
# ---------------------------------------------------------------------------
# Parts marked "PLANNED" are the proposed expansion from 1.5 to 3 credits.
# They are commented out because their files do not exist yet -- uncomment
# each part as its pages are written. A part with no existing chapters will
# fail the build, so uncomment a part only once at least one of its files
# exists.
#
# Rationale for the ordering:
#   - Model Evaluation lands right after Supervised ML, so students meet
#     validation immediately after building their first predictive models
#     and before those habits set.
#   - Emulation and Remote Sensing follow Deep Learning, since both lean on
#     the CNN material.
#   - Uncertainty and Interpretability are grouped as the "can I trust this?"
#     block, after students have models worth interrogating.
#   - Foundation Models and Ethics close the course, where they double as
#     context for the final project.
#
# ---------------------------------------------------------------------------
# ASSIGNMENT SCHEDULE (ten assignments, one per teaching week)
# ---------------------------------------------------------------------------
# Assignment numbers follow course order: each is assigned in the week its
# material is taught. Assignments 3 and 6-10 are not written yet and are
# commented out in place, so the intended slot is visible.
#
#   A1  Data preprocessing -- tropical cyclone records          [written]
#   A2  Supervised ML -- random forests on air quality          [written]
#   A3  Model evaluation -- re-validate A2 honestly             [to write]
#   A4  Unsupervised ML -- climate zones (was Assignment3)      [written]
#   A5  Deep learning -- flood risk NN (was Assignment4)        [written]
#   A6  Climate model emulation                                 [to write]
#   A7  Remote sensing -- land cover classification             [to write]
#   A8  Uncertainty + interpretability                          [to write]
#   A9  Downscaling / forecasting                               [to write]
#   A10 Foundation models -- evaluate a pretrained model        [to write]
#
# Notes on the mapping:
#   - Introduction and Working with Climate Data carry no assignment of their
#     own; the git/repo setup students need is Part 6 of A1.
#   - A8 spans two parts (Uncertainty and Interpretability) rather than
#     splitting into two thin assignments. It is listed under Uncertainty.
#   - Generative Models and Ethics carry no coding assignment. Ethics feeds
#     the final paper instead, which is where that material is assessed.
#   - A3 is deliberately a re-analysis of A2 rather than a new dataset:
#     students re-validate a model they already built, which is the cheapest
#     way to make the lesson land.
# ---------------------------------------------------------------------------

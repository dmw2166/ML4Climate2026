# STRUCTURE
# ---------------------------------------------------------------------------
# Parts mirror the course schedule in the syllabus (CLMT5120, Fall 2026), one
# part per teaching week. Data preprocessing spans Weeks 2 and 3 and is one
# part. Week 8 is fall break and Week 14 is the last class with no new
# material, so neither has a part here. The schedule was pushed back one week
# in late September 2026 and the ethics and policy week was dropped to make room.
#
# Assignments follow the syllabus convention: the assignment listed under a
# week is DUE the Monday of the following week and covers that week's material.
# Weeks 13 and 14 carry no assignment.
#
# Three units are not on the syllabus as separate weeks and have been folded
# into the closest one:
#   - uncertainty            -> Week 6 (model evaluation)
#   - remote sensing (x3)    -> Week 11 (CNNs; its natural application)
#   - physicsai              -> Week 13 (advanced topics)
#
# Pages marked below as stubs are placeholders awaiting real content.
# ---------------------------------------------------------------------------
